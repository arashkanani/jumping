# Render Blueprint — GAME BOX (Vite static site)
# Manual Static Site settings:
#   Build Command:     npm ci && npm run build
#   Publish Directory: dist

services:
  - type: web
    name: game-box
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
