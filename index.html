<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME BOX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-mark">◆</span>
          <h1>GAME BOX</h1>
        </div>
        <div class="survive-bar">
          <span>Survived <strong id="survive-time">0.0</strong>s</span>
          <span class="sep">·</span>
          <span>Circles <strong id="circle-count">0</strong></span>
          <span class="sep">·</span>
          <span>Stick <strong id="stick-width">1.0</strong>x</span>
          <span class="sep">·</span>
          <span>Tier <strong id="stick-tier">Plain</strong></span>
          <span class="sep">·</span>
          <span>Speed <strong id="rope-speed">1.0</strong>x</span>
          <span class="sep">·</span>
          <span id="pads-status" class="pads-status" data-status="disconnected">Pads offline</span>
        </div>
      </header>

      <div class="upgrade-toast hidden" id="upgrade-toast">
        <span id="upgrade-toast-text">UPGRADE</span>
      </div>

      <div class="hud">
        <div class="player-card p1">
          <div class="key-badge">A</div>
          <div class="meta">
            <span class="name">Bunny Blue #7</span>
            <span class="stat">Lives <strong id="lives-p1">●●●</strong></span>
            <span class="stat">Clears <strong id="jumps-p1">0</strong></span>
          </div>
        </div>
        <div class="player-card p2">
          <div class="key-badge">L</div>
          <div class="meta">
            <span class="name">Bunny Dash #3</span>
            <span class="stat">Lives <strong id="lives-p2">●●●</strong></span>
            <span class="stat">Clears <strong id="jumps-p2">0</strong></span>
          </div>
        </div>
      </div>

      <div class="hint" id="hint">
        Jump with <kbd>A</kbd> / <kbd>L</kbd> or foot pads · Space to retry
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title">Round over</h2>
          <p id="overlay-msg"></p>
          <p class="overlay-action">Press <kbd>Space</kbd> to retry</p>
        </div>
      </div>
    </div>

    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
